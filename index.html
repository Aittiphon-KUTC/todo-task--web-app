<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>

    <!--Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">    


</head>
<body>
    <h1>รายการเช็คลิสต์</h1>
    <div class="wrapper">
        <form>
            <input 
                id="todo-input"
                type="text" 
                placeholder="ลองเพิ่มรายการใหม่ดูสิ" 
                autocomplete="off">

                <button id="add-button"> Add </button>
        </form>
        <ul id="todo-list">

            <!--1 รายการ-->
            <li class="todo">
                <input type="checkbox" id="todo-1">
                <label class="custom-checkbox" for="todo-1">
                    <!--ปุ่มเพิ่มรายการ เป้นแบบ SVG-->
                    <svg fill="transparent" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                        <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/>
                    </svg>
                </label>

                <!--ข้อความ-->
                <label for="todo-1" class="todo-text">
                    webdev project with html, css, javascript
                </label>

                <!--ปุ่มลบรายการ เป้นแบบ SVG-->
                <button class="delete-button">
                    <svg fill="var(--secondary-color)" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                        <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
                    </svg>
                </button>
            </li>
            <!--1 รายการ-->

            <!--1 รายการ-->
            <li class="todo">
                <input type="checkbox" id="todo-2">
                <label class="custom-checkbox" for="todo-2">
                    <!--ปุ่มเพิ่มรายการ เป้นแบบ SVG-->
                    <svg fill="transparent" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                        <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/>
                    </svg>
                </label>

                <!--ข้อความ-->
                <label for="todo-2" class="todo-text">
                    webdev project with html, css, javascript
                </label>

                <!--ปุ่มลบรายการ เป้นแบบ SVG-->
                <button class="delete-button">
                    <svg fill="var(--secondary-color)" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                        <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
                    </svg>
                </button>
            </li>
            <!--1 รายการ-->
            
        </ul>
    </div>

    <footer class="footer">
        จัดทำโดย เบนซ์เองครับ <br>
        ขอขอบคุณจากช่อง Youtube : Coding2GO <br>
        --   ระบบเว็บแอปพลิเคชัน สำหรับประกอบการเรียนการสอน   -- <br><br>
        ภาษาที่ใมช้ในการเขียนโปรแกรม : HTML, CSS, JavaScript
    </footer>
</body>
</html>
